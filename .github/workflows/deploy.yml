name: Deploy

# Continuous deployment to the production server.
#
# - Automatically after CI succeeds on a push to develop.
# - Manually from the Actions tab ("Run workflow"): deploys the selected branch,
#   or, with `sha` set, redeploys an earlier release (rollback) without rebuilding.
#
# If the deploy or the smoke test fails, the job rolls production back to the
# last release that passed the smoke test (and restores the pre-deploy database
# dump if the failed release migrated the schema), then fails.
#
# Images are built here and pushed to GHCR, tagged with the commit SHA. The server
# only pulls them: it checks out the same commit (for docker-compose.yml and the
# Makefile) and runs `make deploy`. Setup: README "Continuous deployment".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of an earlier release to redeploy (empty = build and deploy the selected branch)
        required: false
        default: ""

# One deployment at a time; never cancel one half-way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build:
    name: Build and push images
    # Only after a successful CI run on a push (not on PRs), or when the manual
    # run does not just redeploy an existing release.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    # The production server is ARM64, so build natively on an ARM runner
    # (free for public repos; much faster than QEMU emulation). Change this
    # to ubuntu-latest if the server moves to x86_64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Resolve commit
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.sha.outputs.sha }}
          # Links the package to this repo, so GITHUB_TOKEN can pull it on the server.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Baked into the bundle: the public origin the browser calls the API at.
          build-args: API_URL=${{ vars.PUBLIC_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production
    needs: build
    # Also runs when `build` was skipped for a manual redeploy of an existing SHA.
    if: >-
      always()
      && (needs.build.result == 'success'
        || (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.sha != ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      # The short-lived GITHUB_TOKEN is handed to the server to pull from GHCR.
      packages: read
    env:
      SHA: ${{ needs.build.outputs.sha || inputs.sha }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      # Host and user are plain variables, not secrets: GitHub masks secret
      # values everywhere, which hid the site URL (and the repo owner) in logs
      # and stopped the environment URL from being set. Only the key is secret.
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in PUBLIC_URL DEPLOY_PATH SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured (README: Continuous deployment)"; missing=1; fi
          done
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a full commit SHA"; missing=1; }
          exit $missing

      - name: Set up SSH and helpers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

          # `remote` runs the bash script on its stdin on the server, in DEPLOY_PATH
          # and logged in to GHCR. Line 1 of the ssh stdin is the token (kept off
          # command lines), the rest is the script. The server reads both up front
          # and runs the script with stdin detached, so nothing in it can swallow
          # the remaining script lines.
          cat > "$RUNNER_TEMP/remote" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          {
            echo "$GHCR_TOKEN"
            printf 'set -euo pipefail\ncd %q\n' "$DEPLOY_PATH"
            printf 'echo "$GHCR_TOKEN" | docker login ghcr.io -u %q --password-stdin >/dev/null\n' "$GITHUB_ACTOR"
            echo "trap 'docker logout ghcr.io >/dev/null' EXIT"
            cat
          } | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_TARGET" \
              'IFS= read -r GHCR_TOKEN && export GHCR_TOKEN && script=$(cat) && exec bash -c "$script" </dev/null'
          EOF

          # `smoke-test` checks the site from outside: the login page (frontend) and
          # /auth/health (backend + database, routed by the reverse proxy like the API).
          cat > "$RUNNER_TEMP/smoke-test" <<'EOF'
          #!/bin/bash
          for i in $(seq 1 10); do
            if curl -fsSL -o /dev/null "$PUBLIC_URL/login" \
              && curl -fsS -o /dev/null "$PUBLIC_URL/auth/health"; then
              echo "$PUBLIC_URL is up"; exit 0
            fi
            sleep 6
          done
          echo "::error::$PUBLIC_URL/login or $PUBLIC_URL/auth/health did not respond with 2xx"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/remote" "$RUNNER_TEMP/smoke-test"

      - name: Deploy
        id: deploy
        run: |
          "$RUNNER_TEMP/remote" <<EOF
          # .deploy/release is the last release that passed the smoke test, the
          # target of an automatic rollback. The first deploy that keeps it seeds
          # it with the commit checked out now. The rest of .deploy/ describes the
          # deploy in progress, so drop what an earlier one left behind.
          mkdir -p .deploy
          [ -s .deploy/release ] || git rev-parse HEAD > .deploy/release
          rm -f .deploy/backup .deploy/db-revision
          git fetch --quiet origin
          git checkout --quiet --detach $SHA
          make deploy IMAGE_TAG=$SHA BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE
          EOF

      - name: Smoke test
        id: smoke
        run: '"$RUNNER_TEMP/smoke-test"'

      - name: Record release
        run: echo "echo $SHA > .deploy/release" | "$RUNNER_TEMP/remote"

      # A failed deploy or smoke test puts back the last release that passed the
      # smoke test, together with the database as it was before this deploy's
      # migrations (if it ran any). The job still fails, so the bad release shows.
      - name: Roll back
        id: rollback
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          prev=$(echo 'cat .deploy/release 2>/dev/null || true' | "$RUNNER_TEMP/remote")
          if ! [[ "$prev" =~ ^[0-9a-f]{40}$ ]] || [ "$prev" = "$SHA" ]; then
            echo "::error::No earlier release to roll back to (.deploy/release: '$prev')"
            exit 1
          fi
          echo "Rolling back to $prev"
          "$RUNNER_TEMP/remote" <<EOF
          # Only the failed release's Makefile knows what its deploy changed in the
          # database; releases older than the automatic rollback have no such target.
          if grep -q '^deploy-rollback-db:' Makefile; then make deploy-rollback-db; fi
          git checkout --quiet --detach $prev
          make deploy IMAGE_TAG=$prev BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE
          EOF
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Smoke test after rollback
        if: failure() && steps.rollback.outcome == 'success'
        env:
          PREV: ${{ steps.rollback.outputs.prev }}
        run: |
          "$RUNNER_TEMP/smoke-test"
          echo "::error::Deploy of $SHA failed, production was rolled back to $PREV"
          echo "Deploy of \`$SHA\` failed; production was rolled back to \`$PREV\`." >> "$GITHUB_STEP_SUMMARY"
