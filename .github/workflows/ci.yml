name: CI

on:
  push:
    branches: [develop]
  pull_request:

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py derives the test database (todo_ci_test) from DATABASE_URL
      # and creates it; tests never touch todo_ci itself.
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_ci
      # CI-only value - the app refuses to start without a 32+ char key.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-0123456789
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ORIGINS: http://localhost:4200

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Keep in sync with docker/Dockerfile.backend.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Keep in sync with docker/Dockerfile.frontend.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build (SSR + prerender)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      COMPOSE_E2E: docker compose -p todo-e2e -f docker/docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Builds the production backend and frontend images, so this job also
      # covers "the Docker images build".
      - name: Start the e2e stack
        run: $COMPOSE_E2E up --build --wait

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Run tests
        working-directory: e2e
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: $COMPOSE_E2E logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
