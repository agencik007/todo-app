services:
  # Tutaj możesz dodać lokalne nadpisania konfiguracji, np. inne porty lub zmienne środowiskowe
  backend:
    # Dev-only: the stage with pytest/ruff, so `make test-backend` works in this
    # container (the production stage ships runtime dependencies only).
    build:
      target: dev
    environment:
      - DEBUG=True
      # Bind-mounted changes from a Windows/macOS host don't emit file events
      # inside the container, so uvicorn --reload (watchfiles) must poll.
      - WATCHFILES_FORCE_POLLING=true
    # Dev-only: hot-reload (single worker). Production uses the Dockerfile's
    # default CMD (no --reload, multiple workers) via docker-compose.yml alone.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # Dev-only: bind-mount source for hot-reload. Production runs the built
    # image as-is. Uploaded avatars stay in the backend_uploads volume from
    # docker-compose.yml, which is mounted over /app/uploadedFiles here too.
    volumes:
      - ../backend:/app
      - /app/venv # Don't mount virtual environment
    depends_on:
      mailhog:
        condition: service_started

  reminder-worker:
    # Dev-only: the same dev stage and bind-mounted source as the backend. No
    # hot-reload here: `docker restart todo-reminder-worker` after code changes.
    build:
      target: dev
    environment:
      - DEBUG=True
    volumes:
      - ../backend:/app
      - /app/venv
    depends_on:
      mailhog:
        condition: service_started

  frontend:
    # Dev-only: stop at the stage that still has node_modules and the source
    # (the final production stage ships only the built dist/ folder).
    build:
      target: deps
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npx ng serve --host 0.0.0.0 --poll 1000
    # ng serve listens on IPv4 only, while `localhost` in Alpine resolves to
    # ::1 first, so the base healthcheck gets "connection refused" here.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/"]
    # Dev-only: bind-mount source for hot-reload. Production runs the built
    # SSR image as-is.
    volumes:
      - ../frontend:/app
      - /app/node_modules

  # Dev-only tools below: production runs docker-compose.yml alone, so these
  # never start there (`make deploy --remove-orphans` drops old containers).

  # MailHog - captures every email the dev stack sends (Web UI on :8025).
  mailhog:
    image: mailhog/mailhog:latest
    container_name: todo-mailhog
    restart: unless-stopped
    ports:
      # Loopback only - the backend reaches MailHog over todo-network.
      - "127.0.0.1:1025:1025" # SMTP server
      - "127.0.0.1:8025:8025" # Web UI
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PgAdmin - database management. Desktop mode (no login), which is why it
  # must stay out of production.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Bound to loopback only - not reachable from the network.
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - todo-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
    driver: local
