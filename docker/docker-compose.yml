services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      # Bound to loopback only. Host port 5433 leaves 5432 free for a local PostgreSQL.
      - "127.0.0.1:5433:5432"
    networks:
      - todo-network
    healthcheck:
      # $$ escapes compose interpolation so these resolve from the container's
      # own environment (set above), not from the host-side .env file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  backend:
    # Local builds are tagged todo-backend:local. The CD workflow sets
    # BACKEND_IMAGE / IMAGE_TAG so `make deploy` pulls the image built in CI.
    image: ${BACKEND_IMAGE:-todo-backend}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: todo-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (e.g. openssl rand -hex 32)}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      # Required by backend/main.py (comma-separated). "backend" lets other
      # containers on todo-network reach the API by its service name.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # ── Email ──────────────────────────────────────────────────────────────
      - EMAIL_FROM=${EMAIL_FROM:-noreply@example.com}
      - USE_MAILHOG=${USE_MAILHOG:-true}
      # MailHog (dev)
      - MAILHOG_HOST=${MAILHOG_HOST:-mailhog}
      - MAILHOG_PORT=${MAILHOG_PORT:-1025}
      # Real SMTP / Brevo (prod, used when USE_MAILHOG=false)
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # uvicorn only trusts X-Forwarded-For from these peers (default:
      # loopback only, i.e. no one). If you put a reverse proxy in front of
      # this backend, set this to the proxy's IP/CIDR so rate limiting keys
      # off the real client IP instead of the proxy's.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Mark auth cookies Secure. Set to True when the app is served over HTTPS.
      - SECURE_COOKIES=${SECURE_COOKIES:-False}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 8000)); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Angular Frontend
  frontend:
    image: ${FRONTEND_IMAGE:-todo-frontend}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Baked into the production bundle: the URL the browser calls the API at.
        # Set it to the public origin (e.g. https://todo.example.com) when the app
        # sits behind a reverse proxy that routes the API paths to the backend.
        API_URL: ${API_URL:-http://localhost:8000}
    container_name: todo-frontend
    restart: unless-stopped
    environment:
      # Hostnames the SSR server renders for (Angular rejects any other Host /
      # X-Forwarded-Host with 400 once this is set). Empty = no check, but Angular
      # then falls back to client-side rendering for every request and warns that
      # this becomes a 400 in a future version. Production: the public domain plus
      # localhost for the healthcheck, e.g. todo.example.com,localhost,127.0.0.1
      - NG_ALLOWED_HOSTS=${NG_ALLOWED_HOSTS:-}
      # X-Forwarded-* headers a reverse proxy may send. Any other X-Forwarded-*
      # header (e.g. X-Forwarded-For from Caddy/nginx) makes SSR fall back to
      # client-side rendering.
      - NG_TRUST_PROXY_HEADERS=${NG_TRUST_PROXY_HEADERS:-x-forwarded-host,x-forwarded-proto,x-forwarded-for}
    ports:
      - "4200:4200"
    # Runs the image's default CMD (SSR server). docker-compose.override.yml
    # switches it to `ng serve` with a source bind-mount for development.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      # node:22-alpine ships wget (BusyBox), not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MailHog - Email testing tool
  mailhog:
    image: mailhog/mailhog:latest
    container_name: todo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PgAdmin - Database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Bound to loopback only - not reachable from the network.
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - todo-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  todo-network:
    driver: bridge
