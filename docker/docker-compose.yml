version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: todo-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://todo_user:todo_password@db:5432/todo_db
      - DATABASE_TEST_URL=postgresql://todo_user:todo_password@db:5432/todo_db_test
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      # ── Email ──────────────────────────────────────────────────────────────
      - EMAIL_FROM=${EMAIL_FROM:-noreply@example.com}
      - USE_MAILHOG=${USE_MAILHOG:-true}
      # MailHog (dev)
      - MAILHOG_HOST=${MAILHOG_HOST:-mailhog}
      - MAILHOG_PORT=${MAILHOG_PORT:-1025}
      # Real SMTP / Brevo (prod, used when USE_MAILHOG=false)
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - /app/venv # Don't mount virtual environment
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 8000)); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Angular Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    # Development mode (Hot-reloading):
    command: npx ng serve --host 0.0.0.0
    # Production-like mode (SSR):
    # command: node dist/frontend/server/server.mjs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MailHog - Email testing tool
  mailhog:
    image: mailhog/mailhog:latest
    container_name: todo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PgAdmin - Database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - todo-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  todo-network:
    driver: bridge
