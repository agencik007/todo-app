# Settings the backend and the reminder worker share (one definition, so they
# cannot drift apart). Each service adds its own on top.
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (e.g. openssl rand -hex 32)}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
  # Email
  EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
  # Off unless set: if the variable ever went missing from the production env
  # file, emails would otherwise vanish into a MailHog that isn't there. The
  # dev override and docker.env.example turn it on.
  USE_MAILHOG: ${USE_MAILHOG:-false}
  # Web Push (task reminders); empty keys switch push off. Generate a pair
  # with `python -m scripts.generate_vapid_keys`.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  # MailHog (dev only, see docker-compose.override.yml)
  MAILHOG_HOST: ${MAILHOG_HOST:-mailhog}
  MAILHOG_PORT: ${MAILHOG_PORT:-1025}
  # Real SMTP / Brevo (prod, used when USE_MAILHOG=false)
  SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  # PostgreSQL Database
  db:
    # Pinned: Dependabot bumps minor/patch. A major (16, ...) can't start on a
    # 15 data directory - that needs a dump and restore, so it's done by hand
    # together with ci.yml and docker-compose.e2e.yml.
    image: postgres:15.19-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      # Bound to loopback only. Host port 5433 leaves 5432 free for a local PostgreSQL.
      - "127.0.0.1:5433:5432"
    networks:
      - todo-network
    healthcheck:
      # $$ escapes compose interpolation so these resolve from the container's
      # own environment (set above), not from the host-side .env file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Rate limit counters, shared by every backend worker (and kept across
  # backend restarts). Nothing else is stored, so no persistence: a Redis
  # restart only resets the limits. Not published, only todo-network sees it.
  redis:
    image: redis:8.10.3-alpine
    container_name: todo-redis
    restart: unless-stopped
    # Every key has a TTL (the limit window); the cap and eviction policy keep
    # a flood of distinct client keys from growing it without bound.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    # Local builds are tagged todo-backend:local. The CD workflow sets
    # BACKEND_IMAGE / IMAGE_TAG so `make deploy` pulls the image built in CI.
    image: ${BACKEND_IMAGE:-todo-backend}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: todo-backend
    restart: unless-stopped
    environment:
      <<: *app-env
      AI_SUGGESTIONS_ENABLED: ${AI_SUGGESTIONS_ENABLED:-true}
      # Required by backend/main.py (comma-separated). "backend" lets other
      # containers on todo-network reach the API by its service name.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # uvicorn only trusts X-Forwarded-For from these peers (default:
      # loopback only, i.e. no one). If you put a reverse proxy in front of
      # this backend, set this to the proxy's IP/CIDR so rate limiting keys
      # off the real client IP instead of the proxy's.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Mark auth cookies Secure. Set to True when the app is served over HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
      # Rate limit counters (backend/config/rate_limit.py). Unset = in-memory
      # per worker; if Redis goes down the backend falls back to that.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    ports:
      # Loopback only, like db: the reverse proxy on the host
      # reaches it at 127.0.0.1:8000, nothing else should.
      - "127.0.0.1:8000:8000"
    volumes:
      # User avatars. Without a volume they live in the container's writable
      # layer and are lost whenever the container is recreated (every deploy).
      - backend_uploads:/app/uploadedFiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 8000)); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Reminder worker - same image as the backend, sends due task reminders
  # (push + email). Needs the backend's database, email and VAPID settings.
  # Run more than one and each reminder is still sent once (row locks).
  reminder-worker:
    image: ${BACKEND_IMAGE:-todo-backend}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: todo-reminder-worker
    restart: unless-stopped
    # A pass can outlast the default 10 s: let it finish before SIGKILL.
    stop_grace_period: 120s
    command: ["python", "-m", "services.reminder_worker"]
    environment:
      <<: *app-env
      # false = the worker stays up but sends nothing (exiting would make the
      # restart policy loop and fail `up --wait`)
      REMINDER_WORKER_ENABLED: ${REMINDER_WORKER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      # The worker touches this file after every pass (every 30 s).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/reminder-worker.heartbeat') > 120)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Angular Frontend
  frontend:
    image: ${FRONTEND_IMAGE:-todo-frontend}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Baked into the production bundle: the URL the browser calls the API at.
        # Set it to the public origin (e.g. https://todo.example.com) when the app
        # sits behind a reverse proxy that routes the API paths to the backend.
        API_URL: ${API_URL:-http://localhost:8000}
    container_name: todo-frontend
    restart: unless-stopped
    environment:
      # Hostnames the SSR server renders for (Angular rejects any other Host /
      # X-Forwarded-Host with 400 once this is set). Empty = no check, but Angular
      # then falls back to client-side rendering for every request and warns that
      # this becomes a 400 in a future version. Production: the public domain plus
      # localhost for the healthcheck, e.g. todo.example.com,localhost,127.0.0.1
      - NG_ALLOWED_HOSTS=${NG_ALLOWED_HOSTS:-}
      # X-Forwarded-* headers a reverse proxy may send. Any other X-Forwarded-*
      # header (e.g. X-Forwarded-For from Caddy/nginx) makes SSR fall back to
      # client-side rendering.
      - NG_TRUST_PROXY_HEADERS=${NG_TRUST_PROXY_HEADERS:-x-forwarded-host,x-forwarded-proto,x-forwarded-for}
    ports:
      # Loopback only: the reverse proxy on the host reaches it at 127.0.0.1:4200.
      - "127.0.0.1:4200:4200"
    # Runs the image's default CMD (SSR server). docker-compose.override.yml
    # switches it to `ng serve` with a source bind-mount for development.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      # node:22-alpine ships wget (BusyBox), not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  todo-network:
    driver: bridge
