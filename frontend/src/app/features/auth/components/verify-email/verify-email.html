<p-card class="verify-email-card">
    <ng-template pTemplate="header">
        <div class="card-header">
            <h2>Weryfikacja Email</h2>
        </div>
    </ng-template>

    @if (status() === 'loading') {
        <div class="loading-state">
            <p-progressSpinner
                strokeWidth="4"
                animationDuration=".5s"
            >
            </p-progressSpinner>
            <p>Weryfikuję adres email...</p>
        </div>
    }

    @if (status() === 'success') {
        <div class="success-state">
            <i class="pi pi-check-circle"></i>
            <h3>{{ message() }}</h3>
            <p>Za chwilę zostaniesz przekierowany do strony logowania...</p>
            <p-button
                routerLink="/login"
                label="Przejdź do logowania teraz"
                icon="pi pi-sign-in"
            >
            </p-button>
        </div>
    }

    @if (status() === 'error') {
        <div class="error-state">
            <i class="pi pi-times-circle"></i>
            <h3>{{ message() }}</h3>
            <p-message severity="error">
                {{ errorDetail() }}
            </p-message>
            <div class="actions">
                <p-button
                    routerLink="/login"
                    label="Przejdź do logowania"
                    icon="pi pi-sign-in"
                >
                </p-button>
                <p-button
                    severity="secondary"
                    routerLink="/register"
                    label="Zarejestruj się ponownie"
                    icon="pi pi-user-plus"
                >
                </p-button>
            </div>
        </div>
    }
</p-card>
