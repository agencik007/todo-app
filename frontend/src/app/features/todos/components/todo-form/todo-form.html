<form (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
  <div class="form-group">
    <label for="title" class="block mb-2">Tytuł *</label>
    <input pInputText id="title" type="text" [(ngModel)]="title" name="title" placeholder="Wpisz tytuł zadania..."
      class="w-full" />
    @if (!title().trim()) {
    <small class="p-error">Tytuł jest wymagany</small>
    }
  </div>

  <div class="form-group">
    <label for="description" class="block mb-2">Opis</label>
    <textarea pTextarea id="description" [(ngModel)]="description" name="description" rows="4"
      placeholder="Dodaj opcjonalny opis..." class="w-full">
    </textarea>
  </div>

  <div class="form-group">
    <p-checkbox [(ngModel)]="isPublic" name="isPublic" [binary]="true" label="Publiczne" />
    <p class="text-sm text-color-secondary mt-1">
      Zadanie publiczne będzie widoczne dla wszystkich użytkowników
    </p>
  </div>

  <div class="flex gap-2 justify-content-end">
    <p-button type="button" label="Anuluj" severity="secondary" [outlined]="true" (onClick)="onCancel()" />
    <p-button type="submit" [label]="todo() ? 'Zapisz zmiany' : 'Dodaj zadanie'"
      [icon]="todo() ? 'pi pi-save' : 'pi pi-plus'" [disabled]="isSubmitting() || !title().trim()"
      [loading]="isSubmitting()" />
  </div>
</form>
