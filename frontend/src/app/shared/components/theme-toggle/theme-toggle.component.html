<div
    tabindex="0"
    class="theme-toggle"
    [class.mode-system]="mode() === 'system'"
    [class.mode-light]="mode() === 'light'"
    [class.mode-dark]="mode() === 'dark'"
    (keydown.space)="onNextMode()"
    (keydown.enter)="onNextMode()"
    (click)="$event.stopPropagation(); onNextMode()"
>
    <div class="toggle-track">
        <div class="toggle-thumb"></div>

        @for (option of themeOptions(); track option.mode) {
            <div
                tabindex="0"
                class="toggle-icon {{ option.class }}"
                [tooltipPosition]="'left'"
                [pTooltip]="option.tooltip"
                (keydown.space)="$event.stopPropagation(); onSetMode(option.mode)"
                (keydown.enter)="$event.stopPropagation(); onSetMode(option.mode)"
                (click)="$event.stopPropagation(); onSetMode(option.mode)"
            >
                <i
                    class="pi"
                    [class]="option.icon"
                ></i>
            </div>
        }
    </div>
</div>
