@switch (backgroundType()) {
  @case ('aurora') {
    <div class="dynamic-background-container aurora-theme">
      <!-- Flowing aurora ribbons tinted with the primary palette -->
      <div class="aurora"></div>

      <!-- Faint dot grid fading out from the top -->
      <div class="dot-grid"></div>

      <!-- Twinkling sparkles -->
      @for (star of stars; track $index) {
        <span
          class="star"
          [style.width.px]="star.size"
          [style.top.%]="star.top"
          [style.left.%]="star.left"
          [style.height.px]="star.size"
          [style.animation-duration.s]="star.duration"
          [style.animation-delay.s]="star.delay"
        ></span>
      }
    </div>
  }
  @case ('modern') {
    <div class="dynamic-background-container modern-theme">
      <div class="mesh-gradient"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="orb orb-5"></div>
      <div class="orb orb-6"></div>
    </div>
  }
}
