<p-menubar [model]="[]">
  <ng-template #start>
    <a
      routerLink="/todos"
      class="flex align-items-center gap-2 p-link"
      style="text-decoration: none"
    >
      <span class="font-semibold text-xl">📝 Todo App</span>
    </a>
  </ng-template>
  <ng-template #end>
    <div class="flex align-items-center gap-3">
      @if (isLoading()) {
        <p-progressSpinner strokeWidth="4" [style]="{ width: '24px', height: '24px' }" />
      } @else if (isAuthenticated() && currentUser()) {
        <span class="font-medium text-sm text-color-secondary hidden md:block">{{
          currentUser()!.email
        }}</span>
        <p-avatar
          [image]="userAvatar() || undefined"
          [label]="!userAvatar() ? currentUser()!.email.charAt(0).toUpperCase() : undefined"
          shape="circle"
          size="normal"
          class="cursor-pointer border-1 surface-border"
          (click)="menu.toggle($event)"
        />

        <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />

        <input
          type="file"
          id="avatarInput"
          style="display: none"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      } @else {
        <div class="flex gap-2">
          <p-button
            label="Zaloguj się"
            routerLink="/login"
            severity="secondary"
            [outlined]="true"
            size="small"
          />
          <p-button label="Zarejestruj się" routerLink="/register" size="small" />
        </div>
      }
    </div>
  </ng-template>
</p-menubar>

<p-toast position="top-right" />
