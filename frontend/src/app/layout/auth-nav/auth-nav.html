<p-menubar [model]="[]">
    <ng-template #start>
        <a
            style="text-decoration: none"
            routerLink="/todos"
            class="flex align-items-center gap-2 p-link"
        >
            <span class="font-semibold text-xl">📝 {{ 'NAV.HOME' | translate }}</span>
        </a>
    </ng-template>
    <ng-template #end>
        <div class="flex align-items-center gap-3">
            @if (isLoading()) {
                <p-progressSpinner
                    strokeWidth="4"
                    [style]="{ width: '24px', height: '24px' }"
                />
            } @else if (isAuthenticated() && currentUser()) {
                <div class="flex align-items-center gap-2 hidden md:flex">
                    <span class="font-medium text-sm text-color-secondary">{{
                        currentUser()!.email
                    }}</span>
                    <app-theme-toggle class="ml-2"></app-theme-toggle>
                    <app-language-selector></app-language-selector>
                </div>

                <p-avatar
                    size="normal"
                    shape="circle"
                    class="cursor-pointer border-1 surface-border hover:surface-100 transition-colors"
                    [label]="
                        !userAvatar() ? currentUser()!.email.charAt(0).toUpperCase() : undefined
                    "
                    [image]="sanitizedAvatarUrl()"
                    (click)="menu.toggle($event)"
                />

                <p-menu
                    appendTo="body"
                    #menu
                    [popup]="true"
                    [model]="menuItems()"
                ></p-menu>

                <input
                    type="file"
                    style="display: none"
                    id="avatarInput"
                    accept="image/*"
                    (change)="onFileSelected($event)"
                />
            } @else {
                <div class="flex align-items-center gap-3">
                    <app-theme-toggle></app-theme-toggle>
                    <app-language-selector></app-language-selector>
                    <div class="flex gap-2">
                        <p-button
                            size="small"
                            severity="secondary"
                            routerLink="/login"
                            [outlined]="true"
                            [label]="'NAV.LOGIN' | translate"
                        />
                        <p-button
                            size="small"
                            routerLink="/register"
                            [label]="'NAV.REGISTER' | translate"
                        />
                    </div>
                </div>
            }
        </div>
    </ng-template>
</p-menubar>
