<div class="todo-item">
  <div class="todo-content">
    <app-checkbox
      [checked]="todo().completed"
      (changed)="toggleCompleted.emit()"
      class="todo-checkbox-wrapper">
    </app-checkbox>

    <div class="todo-details">
      <div class="todo-title-row">
        <h3 class="todo-title"
            [class.completed]="todo().completed"
            [class.pending]="!todo().completed">
          {{ todo().title }}
        </h3>
        @if (todo().is_public) {
          <app-badge variant="public" title="Zadanie publiczne - widoczne dla wszystkich">
            🌐 Publiczne
          </app-badge>
        }
      </div>
      @if (todo().description) {
        <p class="todo-description">{{ todo().description }}</p>
      }
      <p class="todo-date">
        Utworzone: {{ todo().created_at | date:'short' }}
      </p>
    </div>
  </div>

  <div class="todo-actions">
    @if (canEdit()) {
      <button
        (click)="edit.emit()"
        class="todo-edit-btn">
        <span class="hidden sm:inline">Edytuj</span>
        <span class="sm:hidden">✏️</span>
      </button>
      <button
        (click)="delete.emit()"
        class="todo-delete-btn">
        <span class="hidden sm:inline">Usuń</span>
        <span class="sm:hidden">🗑️</span>
      </button>
    } @else {
      <div class="todo-owner-info">
        <app-badge variant="readonly" title="Zadanie innego użytkownika - tylko do odczytu">
          🔒 Tylko do odczytu
        </app-badge>
      </div>
    }
  </div>
</div>
