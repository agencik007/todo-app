<button mat-icon-button [matMenuTriggerFor]="menu" class="profile-trigger">
    @if (userAvatar()) {
    <img [src]="userAvatar()" alt="Avatar" class="trigger-avatar">
    } @else {
    <mat-icon>account_circle</mat-icon>
    }
</button>

<mat-menu #menu="matMenu" class="profile-menu">
    <div class="user-info" (click)="$event.stopPropagation()">
        <div class="avatar-container">
            @if (userAvatar()) {
            <img [src]="userAvatar()" alt="Avatar" class="large-avatar">
            } @else {
            <div class="avatar-placeholder">
                <mat-icon>person</mat-icon>
            </div>
            }
            <label (click)="fileInput.click()" class="upload-overlay">
                <mat-icon>camera_alt</mat-icon>
            </label>
            <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        </div>
        <div class="user-details">
            <span class="user-email">{{ currentUser()?.email }}</span>
        </div>
    </div>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="fileInput.click()">
        <mat-icon>upload</mat-icon>
        <span>Zmień avatar</span>
    </button>

    @if (userAvatar()) {
    <button mat-menu-item (click)="deleteAvatar()">
        <mat-icon>delete</mat-icon>
        <span>Usuń avatar</span>
    </button>
    }

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="toggleTheme($event)">
        <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>{{ isDarkMode() ? 'Tryb jasny' : 'Tryb ciemny' }}</span>
    </button>

    <button mat-menu-item disabled>
        <mat-icon>lock</mat-icon>
        <span>Zmiana hasła</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Wyloguj</span>
    </button>
</mat-menu>
