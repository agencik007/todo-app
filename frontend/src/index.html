<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      sizes="48x48"
      rel="icon"
      href="favicon.ico"
    />
    <link
      type="image/svg+xml"
      rel="icon"
      href="icons/icon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="icons/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="manifest.webmanifest"
    />
    <!-- Browser UI color (title bar of the installed app). Literal colors:
         meta tags can't read CSS variables. ThemeService overrides both when
         the user picks light or dark instead of following the system. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#18181b"
    />
    <!-- External so the CSP can stay at script-src 'self' (no inline scripts). -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
