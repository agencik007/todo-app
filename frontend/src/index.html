    <!-- Browser UI color (title bar of the installed app). Literal colors:
         meta tags can't read CSS variables. ThemeService overrides both when
         the user picks light or dark instead of following the system. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#18181b"
    />
