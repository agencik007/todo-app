<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant of public/icons/icon.svg for maskable and Apple touch
       icons: opaque square, the mark kept inside the central 80 % safe zone
       (Android crops it to a circle or squircle, iOS rounds the corners). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <path
    d="M148 260 L224 336 L364 176"
    fill="none"
    stroke="#fff"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
